
name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Установка системных зависимостей, чтобы избежать ошибок 'command not found' (127)
    - name: Install system dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
          pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
          libtinfo5 cmake libffi-dev libssl-dev ccache \
          liblzo2-dev libstdc++6:i386 zlib1g:i386

    # Сборка через стабильную версию Buildozer
    - name: Build with Buildozer
      uses: ArtemSBulgakov/buildozer-action@v1
      id: buildozer
      with:
        command: buildozer android debug
        buildozer_version: stable

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: electrician-apk
        path: ${{ steps.buildozer.outputs.filename }}
